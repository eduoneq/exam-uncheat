name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  no-tx-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Reject transmit / injection / deauth / jamming / active-scan code
        run: python tools/no_tx_check.py
  test:
    runs-on: ubuntu-latest
    needs: no-tx-policy
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Simulator end-to-end + verify
        run: |
          exam-uncheat demo --scenario all --data ./ci-data --decide
          exam-uncheat verify ci-data/sessions/*
      - name: Sample data must not contain globally-unique (non-random) MACs
        run: python tools/check_samples.py scenarios
  firmware:
    runs-on: ubuntu-latest
    needs: no-tx-policy
    strategy:
      matrix:
        env: [esp32-s3-devkitc-1, esp32-c6-devkitc-1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install platformio
      - name: Build receive-only firmware
        working-directory: firmware/esp32-sniffer
        run: pio run -e ${{ matrix.env }}
