[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-uncheat"
version = "0.1.0"
description = "Hardware-agnostic, receive-only RF sensor hub for exam integrity (proctor decision support)"
readme = "README.en.md"
license = {text = "Apache-2.0"}
authors = [{name = "EDUONEQ"}]
keywords = ["exam", "proctoring", "bluetooth", "wifi", "rf", "passive", "sensor"]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pyyaml>=6",
  "jsonschema>=4.20",
  "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/eduoneq/exam-uncheat"
Issues = "https://github.com/eduoneq/exam-uncheat/issues"

[project.scripts]
exam-uncheat = "exam_uncheat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exam_uncheat = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
