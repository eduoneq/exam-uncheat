<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>감독관 콘솔 · exam-uncheat</title>
<style>
:root{
  --brand:#003aab; --brand-600:#0a49c4; --brand-50:#eef4fd; --brand-100:#dbe7fa;
  --ink:#0b1a33; --ink-2:#3f5578; --ink-3:#6b7f9f;
  --line:#dfe6f1; --line-2:#c9d5e6; --surface:#ffffff; --canvas:#f5f8fc;
  --urgent:#b42318; --urgent-bg:#fdf1f0; --check:#a15c07; --check-bg:#fdf6ec; --info:#55688a;
  --ok:#1d7a46;
  --r:10px; --r-sm:7px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --fs-xs:12px; --fs-sm:13px; --fs-md:15px; --fs-lg:17px; --fs-xl:21px;
  --font:"Pretendard","Pretendard Variable","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:400 var(--fs-md)/1.55 var(--font);letter-spacing:-0.005em;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
::selection{background:var(--brand-100);color:var(--ink)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
a{color:var(--brand);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{color:var(--brand-600)}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px;border:3px solid var(--canvas)}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:var(--s3) var(--s5);display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:var(--s3);margin-right:auto;min-width:0}
.brand .wm{height:14px;width:auto;display:block}
.brand span{font-size:var(--fs-sm);color:var(--ink-2);font-weight:500;white-space:nowrap;padding-left:var(--s3);border-left:1px solid var(--line)}
.status{display:flex;align-items:center;gap:var(--s4);font-size:var(--fs-sm);color:var(--ink-2);flex-wrap:wrap}
.phase{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink)}
.phase i{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.phase[data-p="baseline"] i{background:var(--check)}
.phase[data-p="exam"] i{background:var(--ok);box-shadow:0 0 0 3px #1d7a461f}
.phase[data-p="closed"] i{background:var(--ink-3)}
.status .sep{width:1px;height:14px;background:var(--line)}

main{max-width:1120px;margin:0 auto;padding:var(--s5) var(--s5) var(--s7)}
.note{display:flex;gap:var(--s2);align-items:flex-start;color:var(--ink-2);font-size:var(--fs-sm);margin:0 0 var(--s5);max-width:75ch}
.note svg{flex:none;margin-top:2px}

.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:var(--s5);align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s5)}
.panel h2,.feed h2{font-size:var(--fs-lg);font-weight:700;letter-spacing:-0.02em;margin:0 0 var(--s4)}
.side{position:sticky;top:76px;display:flex;flex-direction:column;gap:var(--s4)}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.fields label{display:flex;flex-direction:column;gap:6px;font-size:var(--fs-xs);color:var(--ink-2);font-weight:500}
.fields label.wide{grid-column:1/-1}
input[type=text]{font:inherit;font-size:var(--fs-md);color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 11px;min-width:0;width:100%}
input[type=text]::placeholder{color:#8a9ab5}
input[type=text]:hover{border-color:#a9b9d1}
input[type=text]:disabled{background:var(--canvas);color:var(--ink-2);border-color:var(--line)}
input[type=text]:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px #003aab22}
input[type=checkbox]{accent-color:var(--brand);width:16px;height:16px;margin:0}

.steps{list-style:none;margin:var(--s5) 0 0;padding:0;display:flex;flex-direction:column;gap:var(--s2)}
.steps li{display:grid;grid-template-columns:24px 1fr;gap:var(--s3);align-items:start}
.steps .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--line-2);color:var(--ink-2);font-size:var(--fs-xs);font-weight:600;display:grid;place-items:center;margin-top:7px}
.steps li.on .n{background:var(--brand);border-color:var(--brand);color:#fff}
.steps li.done .n{background:var(--brand-50);border-color:var(--brand-100);color:var(--brand)}
.steps small{display:block;color:var(--ink-3);font-size:var(--fs-xs);margin-top:4px;line-height:1.45}

button{font:inherit;font-size:var(--fs-sm);font-weight:600;cursor:pointer;border-radius:var(--r-sm);padding:9px 14px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);transition:background .15s,border-color .15s,color .15s;width:100%;text-align:left}
button:hover{background:var(--brand-50);border-color:#a9b9d1}
button:disabled{opacity:.45;cursor:not-allowed;background:var(--surface)}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
button.primary:hover{background:var(--brand-600)}
button.end{color:var(--urgent)}
button.end:hover{background:var(--urgent-bg);border-color:#efc4bf}

.links{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);font-size:var(--fs-sm)}
details.manual summary,details.act summary{cursor:pointer;font-size:var(--fs-sm);font-weight:600;color:var(--ink);list-style:none;display:flex;align-items:center;gap:6px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
details[open] summary::before{transform:rotate(45deg)}
.manual .fields{margin-top:var(--s3)}
.manual button{margin-top:var(--s3)}
.msg{font-size:var(--fs-sm);color:var(--ink-2);min-height:1.5em;margin:0}
.msg.err{color:var(--urgent)}

/* feed */
.feed-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s3)}
.feed-head h2{margin:0}
.tally{display:flex;gap:var(--s4);font-size:var(--fs-sm);color:var(--ink-2)}
.tally b{color:var(--ink);font-weight:700}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.clue{padding:var(--s4) var(--s5);border-top:1px solid var(--line)}
.clue:first-child{border-top:0}
.clue.urgent:not(.done){background:#fffbfa}
.clue-h{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:700;letter-spacing:0;white-space:nowrap}
.lvl i{width:8px;height:8px;border-radius:2px;background:currentColor}
.urgent .lvl{color:var(--urgent)} .check .lvl{color:var(--check)} .info .lvl{color:var(--info)}
.clue h3{margin:0;font-size:var(--fs-md);font-weight:700;letter-spacing:-0.015em;flex:1 1 220px;min-width:0}
.meta{color:var(--ink-3);font-size:var(--fs-xs);display:flex;flex-wrap:wrap;gap:2px var(--s3);margin-top:6px}
.reasons{margin:var(--s2) 0 0;padding-left:1.1em;color:var(--ink-2);font-size:var(--fs-sm);max-width:75ch}
.reasons li{margin:2px 0}
.sigs{font-size:var(--fs-xs);color:var(--ink-3);margin-top:6px;word-break:break-all;overflow-wrap:anywhere}
.decided{margin-top:var(--s3);font-size:var(--fs-sm);color:var(--ink-2);display:flex;gap:6px;align-items:center}
.decided svg{flex:none}
.clue.done h3,.clue.done .reasons{color:var(--ink-3)}
details.act{margin-top:var(--s3)}
details.act summary{color:var(--brand)}
.act-body{margin-top:var(--s3);padding:var(--s4);background:var(--canvas);border-radius:var(--r-sm)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:var(--s2) var(--s4);font-size:var(--fs-sm)}
.checks label{display:flex;gap:var(--s2);align-items:center;color:var(--ink)}
.act-body input[type=text]{margin-top:var(--s3)}
.decide{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}
.decide button{width:auto;text-align:center}
.empty{padding:var(--s7) var(--s5);text-align:center;color:var(--ink-3);font-size:var(--fs-sm)}
.empty b{display:block;color:var(--ink);font-size:var(--fs-md);margin-bottom:4px}

@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .side{position:static}
  body.live .feed{order:-1}
}
@media (max-width:520px){
  .top-in{padding:var(--s3) var(--s4);gap:var(--s2)}
  .brand span{display:none}
  .status{gap:var(--s3);width:100%}
  main{padding:var(--s4) var(--s4) var(--s7)}
  .panel{padding:var(--s4)}
  .clue{padding:var(--s4)}
  .decide button{flex:1 1 calc(50% - var(--s2))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <p class="note"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="6.3"/><path d="M8 7.2v4M8 4.8v.1" stroke-linecap="round"/></svg>
  <span>여기 뜨는 단서는 감독관이 판단할 때 참고하는 정보이고, 부정행위를 판정하지 않습니다. 신호만 보고 수험생을 지목하지 말고 육안 확인 절차를 따라 주세요.</span></p>

          <label class="wide">시험명<input type="text" id="exam" placeholder="예: 2학기 기말고사" autocomplete="off"></label>

          <label>교시<input type="text" id="period" placeholder="1" autocomplete="off" inputmode="numeric"></label>

          <li id="st2"><span class="n">2</span><div><button id="b2" onclick="startExam()">시험 시작</button><small>기준선을 확정합니다. 리플레이에 시작 신호가 있으면 저절로 넘어갑니다.</small></div></li>
          <li id="st3"><span class="n">3</span><div><button class="end" id="b3" onclick="closeSession()">세션 종료하고 보고서 만들기</button></div></li>

        <div class="tally num" id="counts"></div>
      </div>
      <div class="list" id="clues"></div>
    </section>
  </div>
</main>
<script>
const LV={urgent:"즉시 확인",check:"확인 권장",info:"참고"};
const DEC={confirmed_device:"기기 확인함",false_positive:"오탐",needs_more_check:"추가 확인",no_action:"조치 없음"};
const CHECK=["안경 다리 두께와 버튼","렌즈 옆 카메라·LED","귀 안쪽 이어폰","안경을 책상 위에 올려 확인","소지품과 가방 위치"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
function say(t,err){const m=$("msg");m.textContent=t;m.classList.toggle("err",!!err)}
async function api(path,body){
  const r=await fetch(path,{method:body===undefined?"GET":"POST",headers:{"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){say("요청이 처리되지 않았습니다: "+(j.detail||r.status),true);throw j}
  return j;
}
async function startSession(){const v=id=>$(id).value;
  await api("/api/v1/session/start",{exam:v("exam"),site:v("site"),room:v("room"),period:v("period")});
  say("기준선을 재는 중입니다. 빈 교실 상태로 2~5분 기다려 주세요.");refresh()}
async function startExam(){const j=await api("/api/v1/session/exam",{});
  say("기준선을 확정했습니다. 신호 묶음 "+j.baseline.groups+"개를 기준으로 비교합니다.");refresh()}
async function closeSession(){if(!confirm("세션을 끝내고 보고서를 만들까요? 끝낸 세션은 다시 열 수 없습니다."))return;
  const j=await api("/api/v1/session/close",{});
  say(j.verify.ok?"세션을 끝냈습니다. 원장 무결성 검증도 통과했습니다.":"세션을 끝냈지만 원장 무결성 검증에 실패했습니다. 보고서를 확인해 주세요.",!j.verify.ok);refresh()}
async function manual(){await api("/api/v1/manual-alert",{vendor:$("mvendor").value,note:$("mnote").value});
  $("mvendor").value="";$("mnote").value="";say("상용 탐지기 경보를 타임라인에 남겼습니다.");refresh()}
async function decide(id,d){
  const box=$("cl-"+id);
  const checklist=[...box.querySelectorAll("input[type=checkbox]:checked")].map(x=>x.value);
  const note=box.querySelector(".note-in").value;
  await api("/api/v1/actions",{clue_id:id,decision:d,actor_role:"proctor",checklist,note});
  box.querySelector("details.act").open=false;refresh();
}
const CHK='<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function setSteps(s){
  const p=!s?"none":s.closed?"closed":s.phase==="baseline"?"baseline":"exam";
  const idx={none:1,baseline:2,exam:3,closed:4}[p];
  [1,2,3].forEach(i=>{const li=$("st"+i);li.classList.toggle("on",i===idx);li.classList.toggle("done",i<idx);
    $("b"+i).disabled=!(i===idx||(i===1&&p==="closed")||(i===3&&p==="baseline"));
    $("b"+i).classList.toggle("primary",i===idx&&i!==3)});
  if(p==="closed"){$("b1").classList.add("primary")}
  const live=p==="baseline"||p==="exam";document.body.classList.toggle("live",live);
  ["exam","site","room","period"].forEach(k=>{const el=$(k);el.disabled=live;if(s&&live&&document.activeElement!==el)el.value=(s.meta||{})[k]||""});
  const ph=$("phase");ph.dataset.p=p;
  ph.querySelector("span").textContent={none:"세션 없음",baseline:"기준선 측정 중",exam:"시험 진행 중",closed:"세션 종료"}[p];
}
async function refresh(){
  const st=await api("/api/v1/status");const s=st.session;
  setSteps(s);
  $("sensors").textContent=s?`센서 ${Object.keys(s.sensors).length}대 · 수신 ${s.accepted.toLocaleString("ko-KR")}건`:"센서 0대";
  $("counts").innerHTML=s?`<span>즉시 확인 <b>${s.clue_counts.urgent}</b></span><span>확인 권장 <b>${s.clue_counts.check}</b></span><span>참고 <b>${s.clue_counts.info}</b></span>`:"";
  if(document.querySelector("details.act[open]"))return; // keep a form that is being filled in
  const clues=await api("/api/v1/clues");
  const order={urgent:0,check:1,info:2};
  clues.sort((a,b)=>{const da=a.decisions.length?1:0,db=b.decisions.length?1:0;return da-db||order[a.level]-order[b.level]||(a.ts_first<b.ts_first?1:-1)});
  $("clues").innerHTML=clues.map(c=>{
    const last=c.decisions.length?c.decisions[c.decisions.length-1]:null;
    const id=esc(c.clue_id);
    return `<article class="clue ${c.level} ${last?"done":""}" id="cl-${id}">
      <div class="clue-h"><span class="lvl"><i></i>${LV[c.level]}</span><h3>${esc(c.title)}</h3></div>
      <div class="meta num"><span>${esc(c.ts_first.slice(11,19))}–${esc(c.ts_last.slice(11,19))}</span><span>최고 ${c.max_rssi??"-"} dBm</span><span>구역 ${esc(c.zones.join(", ")||"-")}</span><span>${id}</span></div>
      <ul class="reasons">${c.reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>
      ${c.signature_ids.length?`<div class="sigs">시그니처 ${c.signature_ids.map(esc).join(", ")}</div>`:""}
      ${last?`<div class="decided">${CHK}<span>감독관 판단 <b>${DEC[last.decision]}</b>${last.note?" · "+esc(last.note):""}</span></div>`:""}
      <details class="act"><summary>${last?"판단 다시 기록":"확인하고 기록하기"}</summary>
        <div class="act-body">
          <div class="checks">${CHECK.map(x=>`<label><input type="checkbox" value="${esc(x)}">${esc(x)}</label>`).join("")}</div>
          <input type="text" class="note-in" placeholder="메모 (실명과 수험번호는 적지 마세요)" autocomplete="off">
          <div class="decide">${Object.entries(DEC).map(([k,v])=>`<button onclick="decide('${id}','${k}')">${v}</button>`).join("")}</div>
        </div>
      </details></article>`}).join("")||`<div class="empty"><b>아직 단서가 없습니다</b>${s&&!s.closed?"새 신호가 기준선과 다르게 잡히면 여기에 나타납니다.":"세션을 시작하면 빈 교실 기준선부터 잽니다."}</div>`;
}
refresh();setInterval(refresh,2000);
</script>
</body>
</html>
